apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm-fte
data:
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC_INCOMING: "fte.tickets.incoming"
  KAFKA_TOPIC_OUTGOING: "fte.responses.outgoing"
  KAFKA_CONSUMER_GROUP: "fte-worker"
  OPENAI_MODEL: "gpt-4o-mini"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
