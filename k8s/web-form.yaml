apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-webform
  namespace: crm-fte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-webform
  template:
    metadata:
      labels:
        app: crm-webform
    spec:
      containers:
        - name: webform
          image: crm-fte-webform:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: crm-webform
  namespace: crm-fte
spec:
  selector:
    app: crm-webform
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  namespace: crm-fte
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: support.cloudflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crm-api
                port:
                  number: 80
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: crm-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-webform
                port:
                  number: 80
