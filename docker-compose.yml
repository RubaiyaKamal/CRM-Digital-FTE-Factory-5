version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm_postgres
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_fte
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_fte"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: crm_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: crm_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_fte
      KAFKA_BROKERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: development
    volumes:
      - ./context:/app/context:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: crm_worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_fte
      KAFKA_BROKERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: development
    volumes:
      - ./context:/app/context:ro

  gmail-poller:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: crm_gmail_poller
    command: python -m src.workers.gmail_poller
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_fte
      KAFKA_BROKERS: kafka:29092
      API_BASE_URL: http://api:8000
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL}
      GMAIL_CREDENTIALS_FILE: credentials.json
      GMAIL_POLLING_INTERVAL: ${GMAIL_POLLING_INTERVAL:-30}
      GMAIL_MOCK: ${GMAIL_MOCK:-false}
      APP_ENV: development
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    restart: unless-stopped

  response-handler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: crm_response_handler
    command: python -m src.workers.response_handler
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_fte
      KAFKA_BROKERS: kafka:29092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      WHATSAPP_PHONE_NUMBER: ${WHATSAPP_PHONE_NUMBER}
      WHATSAPP_MOCK: ${WHATSAPP_MOCK:-false}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL}
      GMAIL_CREDENTIALS_FILE: credentials.json
      GMAIL_MOCK: ${GMAIL_MOCK:-false}
      APP_ENV: development
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    restart: unless-stopped

  web-form:
    build:
      context: ./src/web-form
      dockerfile: Dockerfile
      args:
        # React app uses same-origin requests via nginx proxy — no CORS needed
        - REACT_APP_API_URL=http://localhost:3000
    container_name: crm_webform
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
